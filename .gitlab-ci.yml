#-------------------------------------------------------------------------------#
#        Discover additional configuration options in our documentation         #
#              https://www.jetbrains.com/help/qodana/gitlab.html                #
#-------------------------------------------------------------------------------#

include:
  - component: $CI_SERVER_FQDN/qodana/qodana/qodana-gitlab-ci@v2026.2
    inputs:
      # When mr-mode is set to true, Qodana analyzes only the files that have been changed
      mr-mode: false
      use-caches: true
      post-mr-comment: true
      # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
      upload-result: false
      # quick-fixes available in Ultimate and Ultimate Plus plans
      push-fixes: 'none'

qodana:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: '20'
  DOCKER_DRIVER: overlay2

# ============================================================
# Lint
# ============================================================
lint:server:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script:
    - cd server && npm ci
    - npm run lint
  cache:
    key: server-$CI_COMMIT_REF_SLUG
    paths:
      - server/node_modules/

# ============================================================
# Tests
# ============================================================
test:server:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: empire_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DB_HOST: postgres
    DB_NAME: empire_test
    DB_USER: test_user
    DB_PASSWORD: test_pass
    REDIS_URL: redis://redis:6379
  script:
    - cd server && npm ci
    - npm test
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: server/coverage/cobertura-coverage.xml

# ============================================================
# End-to-end smoke: живой сервер + БД/Redis, полный игровой цикл
# ============================================================
test:smoke:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: empire_smoke
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DB_HOST: postgres
    DB_NAME: empire_smoke
    DB_USER: test_user
    DB_PASSWORD: test_pass
    REDIS_URL: redis://redis:6379
  script:
    - cd server && npm ci
    - npm run migrate
    - npx ts-node src/index/index.ts &   # сервер в фоне
    - sleep 12
    - node ../tools/smoke-test-inventory.mjs

# ============================================================
# Build client (Vite bundle as artifact)
# ============================================================
build:client:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - cd client && npm ci
    - npm run build
  artifacts:
    paths:
      - client/web/game/
  cache:
    key: client-$CI_COMMIT_REF_SLUG
    paths:
      - client/node_modules/

# ============================================================
# Build Docker Image
# ============================================================
build:server:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -f server/Dockerfile -t $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/server:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/server:latest
  only:
    - main
    - develop

# ============================================================
# Build Client Docker Image
# ============================================================
build:client-image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -f client/Dockerfile -t $CI_REGISTRY_IMAGE/client:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/client:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/client:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/client:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/client:latest
  only:
    - main
    - develop

# ============================================================
# Deploy — на VPS по SSH. Требует переменные проекта (CI/CD Settings):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_DIR, DEPLOY_SSH_KEY (private key)
# На сервере должен быть сработавший deploy/README.md (Docker + deploy/.env).
# Пока переменные не заданы, джобы не запускаются.
# ============================================================
deploy:staging:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $DEPLOY_HOST && $DEPLOY_SSH_KEY'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_DIR && git pull --ff-only && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build"
  environment:
    name: staging

deploy:production:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DEPLOY_HOST && $DEPLOY_SSH_KEY'
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_DIR && git pull --ff-only && docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build"
  environment:
    name: production
