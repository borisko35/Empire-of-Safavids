stages:
  - lint
  - test
  - build
  - deploy

variables:
  NODE_VERSION: '20'
  DOCKER_DRIVER: overlay2

# ============================================================
# Lint
# ============================================================
lint:server:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  script:
    - cd server && npm ci
    - npm run lint
  cache:
    key: server-$CI_COMMIT_REF_SLUG
    paths:
      - server/node_modules/

# ============================================================
# Tests
# ============================================================
test:server:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:16-alpine
    - redis:7-alpine
  variables:
    POSTGRES_DB: empire_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    DB_HOST: postgres
    DB_NAME: empire_test
    DB_USER: test_user
    DB_PASSWORD: test_pass
    REDIS_URL: redis://redis:6379
  script:
    - cd server && npm ci
    - npm test
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: server/coverage/cobertura-coverage.xml

# ============================================================
# Build Docker Image
# ============================================================
build:server:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -f server/Dockerfile -t $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA .
    - docker tag $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA $CI_REGISTRY_IMAGE/server:latest
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/server:latest
  only:
    - main
    - develop

# ============================================================
# Deploy (staging)
# ============================================================
deploy:staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploy to staging server"
    - echo "Image: $CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA"
  environment:
    name: staging
    url: https://staging.empire-of-safavids.com
  only:
    - develop
  when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploy to production"
  environment:
    name: production
    url: https://empire-of-safavids.com
  only:
    - main
  when: manual
