# ============================================================
# Дополнение к боевой выкладке: игра через туннель Cloudflare
# ============================================================
#
# Путь для бесплатного хостинга: стек крутится на домашней машине,
# наружу выходит туннель Cloudflare. Своего IP и белого адреса не
# нужно, домен остаётся прежним.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml -f docker-compose.tunnel.yml \
#     --env-file .env up -d --build
#
# Нужен домен на бесплатном тарифе Cloudflare (там же создаётся туннель,
# см. deploy/README.md, раздел «Бесплатный хостинг»). Токен кладётся в
# deploy/.env как CLOUDFLARE_TUNNEL_TOKEN.
# ============================================================

name: empire-of-safavids

services:
  # Caddy на этом пути не нужен: сертификат выпускает и терминирует
  # Cloudflare, а наружу смотрит туннель, а не порты машины. Профиль
  # специально не включается — сервис не стартует, и порты 80/443 на
  # машине не открываются вовсе. Соответственно и сертификат Let's
  # Encrypt не запрашивается: для публичного адреса на туннеле он был бы
  # лишним обращением, которое ничего не меняет.
  caddy:
    profiles: ['tls-direct']

  # Сам туннель. Идёт по адресу `client` — то есть внутрь той же сети
  # compose, без публикации портов: игра наружу не светится, и на
  # домашней машине нечего закрывать в брандмауэре.
  #
  # WebSocket'ы (socket.io) через туннель проходят: в опубликованном
  # адресе они не выключаются.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      - client
    restart: unless-stopped