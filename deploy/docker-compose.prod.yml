# ============================================================
# Боевой стек — Empire of Safavids (VPS + HTTPS)
# ============================================================
# Запуск на сервере:  см. deploy/README.md
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Наружу смотрит только Caddy (80/443, автоматические сертификаты
# Let's Encrypt). База, Redis, игровой сервер и клиент — во
# внутренней сети; игроку достаточно браузера и адреса домена.

name: empire-of-safavids

services:
  # ── TLS-прокси: единственная точка входа ────────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # сертификаты Let's Encrypt
      - caddy_config:/config
    depends_on:
      - client
    restart: unless-stopped

  # ── Клиент: лендинг + игра + прокси API/сокетов на сервер ───
  client:
    build:
      context: ..
      dockerfile: client/Dockerfile
    depends_on:
      - server
    restart: unless-stopped

  # ── Миграции БД: разовый прогон перед стартом сервера ───────
  migrate:
    build:
      context: ..
      dockerfile: server/Dockerfile
    command: npx tsx src/database/migrate.ts
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-empire_of_safavids}
      DB_USER: ${DB_USER:-safavid_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── Игровой сервер ──────────────────────────────────────────
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-empire_of_safavids}
      DB_USER: ${DB_USER:-safavid_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in deploy/.env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://${DOMAIN}}
      # Сколько прокси стоит перед сервером: nginx клиента и Caddy. Express
      # без этого значения берёт req.ip из адреса сокета, то есть у всех
      # игроков ip был бы адресом контейнера nginx — один счётчик
      # ограничений на весь сервер. Подробнее в server/src/index/index.ts.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      # Вход через внешние сервисы. Пустое значение — не ошибка: OAuthService
      # считает провайдера выключенным и прячет кнопку. Пока переменные не
      # перечислены здесь, значения из deploy/.env до контейнера не доходят.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      # Xsolla. Пустое значение - не ошибка: xsollaConfig вернёт null, и
      # провайдер останется выключенным, а маршрут ответит «провайдер не
      # настроен» вместо 500. Пока переменные здесь не перечислены, значения
      # из deploy/.env до контейнера просто не доходят: файл на сервере был
      # в порядке, а сервер их не видел - и это выглядело как «ключи не
      # подхватились», хотя дело было в этом списке.
      XSOLLA_ENABLED: ${XSOLLA_ENABLED:-}
      XSOLLA_PUBLISHER_ID: ${XSOLLA_PUBLISHER_ID:-}
      XSOLLA_PROJECT_ID: ${XSOLLA_PROJECT_ID:-}
      XSOLLA_API_KEY: ${XSOLLA_API_KEY:-}
      XSOLLA_WEBHOOK_SECRET: ${XSOLLA_WEBHOOK_SECRET:-}
      XSOLLA_SANDBOX: ${XSOLLA_SANDBOX:-}
      # Секрет виджета ВХОДА (Xsolla Login). Он не платёжный и в блоке
      # выше не значился: §126 добавил вход, а этой строки не добавил, и
      # ключ лежал бы в deploy/.env на сервере, не доходя до контейнера —
      # точно та ловушка, о которой сказано комментарием выше. Вход молча
      # отвечал бы 503 not_configured при живом ключе.
      XSOLLA_LOGIN_SECRET: ${XSOLLA_LOGIN_SECRET:-}
      # ЮKassa. Раньше эти переменные тоже не были перечислены здесь, то
      # есть значения из .env до контейнера не доходили и провайдер молча
      # оставался выключенным - при живых ключах в файле.
      PAYMENT_JOBIK_ENABLED: ${PAYMENT_JOBIK_ENABLED:-}
      PAYMENT_JOBIK_SHOP_ID: ${PAYMENT_JOBIK_SHOP_ID:-}
      PAYMENT_JOBIK_SECRET: ${PAYMENT_JOBIK_SECRET:-}
      # Intellect Money — активный провайдер приёма платежей (§121). Ровно та
      # же ловушка, что и у ЮKassa выше: пока эти три строки здесь не
      # перечислены, значения из deploy/.env до контейнера не доходят,
      # intellectMoneyConfig() видит пустое окружение и возвращает null —
      # а игрок на «Пополнить» получает «провайдер не настроен» при живых
      # ключах в файле.
      PAYMENT_INTELLECTMONEY_ENABLED: ${PAYMENT_INTELLECTMONEY_ENABLED:-}
      PAYMENT_INTELLECTMONEY_ESHOP_ID: ${PAYMENT_INTELLECTMONEY_ESHOP_ID:-}
      PAYMENT_INTELLECTMONEY_SECRET_KEY: ${PAYMENT_INTELLECTMONEY_SECRET_KEY:-}
      # Секрет Sign API. Код вебхука его пока не читает, но он есть в примере
      # .env, и перечисление здесь держит пример и compose в согласии:
      # проверка «всё, что в примере, доходит до контейнера» не должна
      # нуждаться в исключениях - они и есть места, где баг прорастает.
      PAYMENT_INTELLECTMONEY_SIGN_SECRET_KEY: ${PAYMENT_INTELLECTMONEY_SIGN_SECRET_KEY:-}
      # PUBLIC_URL: адрес, на который провайдер возвращает игрока после
      # оплаты. Без него адрес собирался из заголовка запроса, а игрок мог
      # прийти с чужого домена - и возврат ушёл бы не туда, куда он
      # собирался.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Симулятор платежей. На боевом сервере обязан быть false.
      PAYMENTS_SIMULATOR: ${PAYMENTS_SIMULATOR:-}
      # Куда складывать загруженные фото и видео. Без этой переменной сервер
      # положил бы файлы внутрь контейнера, и они пропали бы при пересборке.
      MEDIA_DIR: /app/uploads/media
      LOG_LEVEL: info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - server_logs:/app/server/logs
      # Установщик Windows для кнопки «Скачать» на лендинге
      - ../site/install:/app/server/site/install:ro
      # Загруженные фото и видео. Том, а не папка в образе: пересборка
      # контейнера не должна уносить файлы сотрудников
      - media_uploads:/app/uploads/media
    restart: unless-stopped

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-empire_of_safavids}
      POSTGRES_USER: ${DB_USER:-safavid_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-safavid_user} -d ${DB_NAME:-empire_of_safavids}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_config:
  server_logs:
  # Загруженные сотрудниками фото и видео живут в томе, а не в образе:
  # пересборка контейнера не должна уносить их
  media_uploads:
