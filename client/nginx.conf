# Лендинг в корне, игра на /game/ (тот же base, что и в сборке Vite),
# API/локали/сокеты/установщик — прокси на игровой сервер (сервис `server` из compose)
server {
  listen 80;

  # Игра: статика из сборки Vite (web/game)
  location /game/ {
    alias /usr/share/nginx/html/game/;
    try_files $uri $uri/ /game/index.html;
    # Входной HTML перезапрашивается всегда: в нём имена файлов сборки, и
    # закэшированная копия означала бы, что игрок месяц ходит на старую
    # версию игры и не понимает, почему «выкатили, а ничего не изменилось».
    add_header Cache-Control "no-cache" always;
  }

  # Снятая страница объявления. 1 октября 2026 объявление об обновлении
  # отслужило своё: файл убран в docs/archive/, из меню и ленты новостей
  # ссылка снята. Но правило location / ниже отдаёт на любой несуществующий
  # путь лендинг кодом 200, и /update.html продолжал жить: поисковик и
  # человек из старой закладки получали не 404, а главную страницу.
  #
  # То же самое уже чинили для картинок (см. ниже): отсутствие файла должно
  # быть видно как отсутствие, а не как успешная загрузка чужой страницы.
  location = /update.html {
    return 404;
  }

  # Файлы сборки игры содержат хеш содержимого в имени, поэтому могут
  # меняться только вместе с именем. Их кэшируем на год безусловно - это
  # то, ради чего игра вообще должна открываться быстро.
  location ^~ /game/assets/ {
    alias /usr/share/nginx/html/game/assets/;
    # Отсутствующий файл идёт в отдельный именованный обработчик.
    #
    # ПОЧЕМУ НЕ ПРОСТО `try_files $uri =404`. Здесь add_header с `immutable`
    # действует на ВСЕ ответы, включая ошибку: отсутствие файла отдавалось как
    # 404 с заголовком «кэшировать на год и не обновлять». Cloudflare записывал
    # такой ответ в кэш на год, и игра не грузилась: HTML уже ссылался на новый
    # бандл, а по его адресу edge годами отдавал «файла нет».
    #
    # Это случилось трижды — 8 октября, 15 октября и сегодня. Проверка выкатки
    # видела 404, контейнер отдавал 200, и дело было не в контейнере.
    try_files $uri @game_asset_missing;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 404 по сборке игры не кэшируется НИКОГДА.
  #
  # Имена файлов содержат хеш содержимого, поэтому отсутствующий файл сборки —
  # это всегда «выкатка ещё не доехала», а не «файла не будет». Кэшировать
  # такое нельзя: срок год, а файл появляется через секунды.
  location @game_asset_missing {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    default_type text/plain;
    return 404 "game asset not found\n";
  }

  # ── Модели персонажей закрыты входом ────────────────────────
  #
  # ЧТО БЫЛО. `/game/models/` отдавался кому угодно: любой, кто знал адрес,
  # скачивал `walking.glb` отдельным файлом, без входа и без всякого спроса.
  # А анимации персонажей приехали из библиотеки Adobe Mixamo, и условия
  # Mixamo игру разрешают прямо, а раздачу исходных файлов — нет (разбор:
  # THIRD_PARTY.md). То есть игра раздавала ровно то, что лицензия запрещает
  # раздавать.
  #
  # ПОЧЕМУ ПРОВЕРКА ЗДЕСЬ, А НЕ В КОДЕ ИГРЫ. Проверка в клиенте проверкой не
  # является: файл всё равно лежит по публичному адресу, и достаточно открыть
  # его в браузере. Закрыть файл можно только до его отдачи — то есть здесь.
  #
  # auth_request спрашивает сервер и пускает только на 2xx. Заголовок входа
  # ставит клиент (client/src/app/game3d/modelAccess.ts): сессия игры живёт
  # в localStorage и уходит на сервер заголовком Authorization, как у всего
  # остального API. Печенек у игры нет.
  #
  # 401 СНАРУЖИ — ЭТО НОРМА, А НЕ ПОЛОМКА. Заголовок кэша здесь идёт с
  # `always`, как везде в этом файле (см. cacheHeaders.test.ts: заголовок без
  # `always` не отдаётся на авариях, когда он нужнее всего). Для отказа это
  # безопасно именно из-за `private`: промежуточный кэш такой ответ не хранит,
  # а браузер обязан переспросить по `no-cache` — то есть отказ не может
  # залипнуть ни в Cloudflare, ни у игрока после входа.
  location ^~ /game/models/ {
    auth_request /_eos_models_gate;
    alias /usr/share/nginx/html/game/models/;
    # Отсутствующая модель — честный 404 тем же именованным обработчиком,
    # что у файлов сборки: он отдаётся без кэша.
    try_files $uri @game_asset_missing;
    # private — промежуточный кэш (Cloudflare) эти файлы хранить не должен:
    # ответ зависит от того, кто спросил, а ключ кэша у него один на всех,
    # и тогда модель без входа получил бы следующий запросивший.
    # no-cache — модель меняется под тем же именем (хеша в имени нет),
    # поэтому браузер обязан спросить заново и получить 304 либо новый файл.
    add_header Cache-Control "private, no-cache" always;
    add_header Vary "Authorization" always;
  }

  # Проверка входа для закрытых файлов. internal — снаружи путь недоступен.
  location = /_eos_models_gate {
    internal;
    proxy_pass http://server:3000/api/auth/gate;
    # Тело подзапроса не нужно: это GET, а Content-Length от исходного
    # запроса только сбил бы сервер с толку.
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    # Токен передаём явно. ПРОВЕРЕНО ЛОМКОЙ, И НЕ ТАК, КАК ОЖИДАЛОСЬ: без
    # этой строки nginx всё равно отдаёт Authorization подзапросу (auth_request
    # создаёт подзапрос с заголовками исходного запроса), и вошедший получает
    # файл. То есть строку можно убрать. Оставлена намеренно: в конфиге
    # видно, что запрос входа без токена бессмыслен, и это не придётся
    # выяснять заново, если схема прокси изменится.
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
  }

  # Файлы лендинга: картинки, стили, скрипты. Здесь отсутствие файла должно
  # давать честный 404, а НЕ подставлять лендинг.
  #
  # Почему это важно. Общее правило location / ниже заканчивается на
  # try_files ... /index.html - это нужно, чтобы /forum и прочие пути без
  # расширения отдавали страницу. Но для файлов с расширением та же подстановка
  # означала тихую поломку: браузер просит картинку, получает HTML лендинга с
  # кодом 200, не может его показать и рисует пустое место. Ни в сети, ни в
  # журнале сервера не видно, что файла нет.
  #
  # На этом уже стоял трейлер: он ссылался на три файла, которых нет, и все
  # три отдавали ровно 23867 байт - размер лендинга. Три из шести сцен были
  # пустыми, и по коду ответа это не отличалось от успеха.
  location ^~ /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location ^~ /css/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location ^~ /js/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Лендинг: иконка, фон, история империи, кнопки «Играть» и «Скачать»
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # Скрипты и стили лендинга названы обычными именами (main.js), без
    # хеша, поэтому кэшировать их надолго нельзя - файл меняется, а имя
    # остаётся прежним. no-cache заставляет браузер уточнять по ETag: ответ
    # либо пустой (304), либо с новым файлом.
    add_header Cache-Control "no-cache" always;
  }

  # Установщик отдаёт игровой сервер (файл лежит в site/install)
  location /download/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Healthcheck для бейджа версии на лендинге (main.js fetch /health)
  location = /health {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # REST, локали и WebSocket'ы живут на игровом сервере
  location ~ ^/(api|locales|socket.io)/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
