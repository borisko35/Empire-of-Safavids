# Лендинг в корне, игра на /game/ (тот же base, что и в сборке Vite),
# API/локали/сокеты/установщик — прокси на игровой сервер (сервис `server` из compose)
server {
  listen 80;

  # Игра: статика из сборки Vite (web/game)
  location /game/ {
    alias /usr/share/nginx/html/game/;
    try_files $uri $uri/ /game/index.html;
  }

  # Лендинг: иконка, фон, история империи, кнопки «Играть» и «Скачать»
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Установщик отдаёт игровой сервер (файл лежит в site/install)
  location /download/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # REST, локали и WebSocket'ы живут на игровом сервере
  location ~ ^/(api|locales|socket.io)/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
