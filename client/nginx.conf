# Игра на /game/ (тот же base, что и в сборке Vite), остальное — прокси на игровой сервер
server {
  listen 80;

  location /game/ {
    alias /usr/share/nginx/html/game/;
    try_files $uri $uri/ /game/index.html;
  }

  # Кнопка «Играть» ведёт на /game/ — с корня сразу редирект
  location = / {
    return 302 /game/;
  }

  # REST, локали и WebSocket'ы живут на игровом сервере (сервис `server` из compose)
  location ~ ^/(api|locales|socket.io)/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
