# Лендинг в корне, игра на /game/ (тот же base, что и в сборке Vite),
# API/локали/сокеты/установщик — прокси на игровой сервер (сервис `server` из compose)
server {
  listen 80;

  # Игра: статика из сборки Vite (web/game)
# ── Sticky-routing по шарду ──────────────────────────────────────
#
# ЗАЧЕМ. Шард теперь держит один инстанс (аренда, см. ShardLease). Но если
# игрок попадёт не на тот инстанс, аренда обернётся против нас: он будет в
# пустом мире, а монстры его шарда будут спокойно жить у соседа. Аренда сама
# по себе ничего не гарантирует — нужна ещё и маршрутизация к хозяину.
#
# ПОЧЕМУ КАРТА, А НЕ STICKY-МОДУЛЬ. Стандартный sticky — это отдельный модуль
# nginx, которого в лёгком образе может не быть. Карта по cookie работает на
# голом nginx: переменная $cookie_eos_shard выбирает upstream.
#
# Шарды заранее известны (GAME_SERVERS, shared/constants.ts), поэтому все
# восемь перечислены явно. Сейчас все ведут на один контейнер — это вырождается
# в единственный upstream и не меняет поведение. Как только появится второй
# контейнер, достаточно переписать одну строку в его группе.
#
# ЧЕСТНО ПРО БЕЗОПАСНОСТЬ. Cookie ставит клиент (document.cookie), то есть её
# можно подделать. Это не дыра: подделка ведёт максимум на чужой инстанс, где
# игрок увидит пустой мир. Данных за пределами своего шарда cookie не открывает
# — доступ решает сервер, не nginx.
map $cookie_eos_shard $game_backend {
  default           server:3000;
  baku              server:3000;
  nakhchivan        server:3000;
  ganja             server:3000;
  tebriz            server:3000;
  khoy              server:3000;
  rasht             server:3000;
  isfahan           server:3000;
  derbent           server:3000;
}

# Резолвер обязателен: переменная в proxy_pass разрешается на запрос,
# а не при старте — иначе неизвестный на старте upstream рушит nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream game_servers {
  # Пул на будущее: второй и третий инстансы добавляются здесь и в карту выше.
  server server:3000;
}
  location /game/ {
    alias /usr/share/nginx/html/game/;
    try_files $uri $uri/ /game/index.html;
    # Входной HTML перезапрашивается всегда: в нём имена файлов сборки, и
    # закэшированная копия означала бы, что игрок месяц ходит на старую
    # версию игры и не понимает, почему «выкатили, а ничего не изменилось».
    add_header Cache-Control "no-cache" always;
  }

  # Снятая страница объявления. 1 октября 2026 объявление об обновлении
  # отслужило своё: файл убран в docs/archive/, из меню и ленты новостей
  # ссылка снята. Но правило location / ниже отдаёт на любой несуществующий
  # путь лендинг кодом 200, и /update.html продолжал жить: поисковик и
  # человек из старой закладки получали не 404, а главную страницу.
  #
  # То же самое уже чинили для картинок (см. ниже): отсутствие файла должно
  # быть видно как отсутствие, а не как успешная загрузка чужой страницы.
  location = /update.html {
    return 404;
  }

  # Файлы сборки игры содержат хеш содержимого в имени, поэтому могут
  # меняться только вместе с именем. Их кэшируем на год безусловно - это
  # то, ради чего игра вообще должна открываться быстро.
  location ^~ /game/assets/ {
    alias /usr/share/nginx/html/game/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Файлы лендинга: картинки, стили, скрипты. Здесь отсутствие файла должно
  # давать честный 404, а НЕ подставлять лендинг.
  #
  # Почему это важно. Общее правило location / ниже заканчивается на
  # try_files ... /index.html - это нужно, чтобы /forum и прочие пути без
  # расширения отдавали страницу. Но для файлов с расширением та же подстановка
  # означала тихую поломку: браузер просит картинку, получает HTML лендинга с
  # кодом 200, не может его показать и рисует пустое место. Ни в сети, ни в
  # журнале сервера не видно, что файла нет.
  #
  # На этом уже стоял трейлер: он ссылался на три файла, которых нет, и все
  # три отдавали ровно 23867 байт - размер лендинга. Три из шести сцен были
  # пустыми, и по коду ответа это не отличалось от успеха.
  location ^~ /assets/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400" always;
  }

  location ^~ /css/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  location ^~ /js/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
  }

  # Лендинг: иконка, фон, история империи, кнопки «Играть» и «Скачать»
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
    # Скрипты и стили лендинга названы обычными именами (main.js), без
    # хеша, поэтому кэшировать их надолго нельзя - файл меняется, а имя
    # остаётся прежним. no-cache заставляет браузер уточнять по ETag: ответ
    # либо пустой (304), либо с новым файлом.
    add_header Cache-Control "no-cache" always;
  }

  # Установщик отдаёт игровой сервер (файл лежит в site/install)
  location /download/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Healthcheck для бейджа версии на лендинге (main.js fetch /health)
  location = /health {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # REST, локали и WebSocket'ы живут на игровом сервере
  location ~ ^/(api|locales|socket.io)/ {
    proxy_pass http://$game_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
